name: Reusable build
on: workflow_call
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: microsoft
          architecture: x64
          check-latest: true
          verify-signature: true
          cache: maven
      - run: mvn -B verify package --file pom.xml
      - uses: actions/upload-artifact@v7
        with:
          path: target/auik_prod-v*-shaded.jar
          if-no-files-found: error
          archive: false
      - shell: bash
        run: |
          TMPDIR=$(mktemp -d)
          mv target/auik_prod-v*-shaded.jar "$TMPDIR"/auik.jar
          jpackage --name auik --input "$TMPDIR" --main-jar auik.jar --main-class de.bielefeld.umweltamt.aui.AUIKataster
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          path: auik*.exe
          if-no-files-found: error
          archive: false
